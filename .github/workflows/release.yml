name: Publish to PyPI

on:
  # Publish only when a GitHub release is published, so a version bump on
  # main cannot ship an untagged artifact. workflow_dispatch is the manual
  # recovery path.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write  # Needed for trusted publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
