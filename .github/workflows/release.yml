name: Publish to PyPI

on:
  # Publish only when a GitHub release is published, so a version bump on
  # main cannot ship an untagged artifact. workflow_dispatch is the manual
  # recovery path and must name the tag to publish.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to publish (e.g. v0.9.9)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write  # Needed for trusted publishing OIDC

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `release: published` checks out the default branch by default.
          # Publish exactly the tagged commit, never whatever main points at
          # now — main may have moved on since the tag was cut.
          ref: ${{ github.event.release.tag_name || inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verify the tag matches the package version
        env:
          RELEASE_REF: ${{ github.event.release.tag_name || inputs.ref }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          ref = os.environ["RELEASE_REF"].strip()
          tag = ref if ref.startswith("v") else f"v{ref}"
          expected = f"v{version}"
          assert tag == expected, f"tag {tag} does not match pyproject version {expected}"
          print(f"tag {tag} matches pyproject version {version}")
          PY

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build package
        run: python -m build

      # No `skip-existing`: PyPI versions are immutable, so a duplicate must
      # fail the job instead of silently reusing the old artifact. Recovery
      # from a partial upload means bumping the version.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
