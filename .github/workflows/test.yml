name: Run tests

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Fast feedback on every supported Python version.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: |
          python -m pytest tests/test_core.py tests/test_features.py tests/test_polish_regressions.py tests/test_regression_bugs.py -q --tb=short

      - name: Run integration tests (CLI + MCP)
        run: |
          python -m pytest tests/test_integration.py tests/test_single_instance.py tests/test_serve_single_instance.py -q --tb=short

  # The gate that would have caught the REST auth regression: every test file,
  # one Python version, plus a blocking dependency audit.
  full-suite:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run full test suite
        run: |
          python -m pytest tests/ -q --tb=short

      - name: Dependency vulnerability scan (blocking)
        run: |
          python -m pip install pip-audit
          # Ignored: the three chromadb advisories affect the multi-tenant
          # Chroma HTTP server (RBAC checks, trust_remote_code code injection).
          # Memorius embeds chromadb through PersistentClient only, is
          # single-tenant, and never sets trust_remote_code. Re-evaluate when
          # chromadb publishes a fixed release.
          python -m pip-audit --skip-editable \
            --ignore-vuln PYSEC-2026-3813 \
            --ignore-vuln PYSEC-2026-3814 \
            --ignore-vuln PYSEC-2026-3815
