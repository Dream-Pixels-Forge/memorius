[project]
name = "memorius"
version = "0.1.0"
description = "Universal memory adapter system — hooks lifecycle, REST gateway, and plugin manifest for any AI agent. Bridges any AI to MemPalace and other memory backends."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Memorius Contributors"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
gateway = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/Dream-Pixels-Forge/memorius"
Repository = "https://github.com/Dream-Pixels-Forge/memorius"
Issues = "https://github.com/Dream-Pixels-Forge/memorius/issues"

[project.scripts]
memorius-hook = "memorius.hooks.cli:main"
memorius-serve = "memorius.gateway.http_server:main"
memorius-plugin-gen = "memorius.plugin_gen.cli:main"
memorius-normalize = "memorius.normalizers.cli:main"

[tool.setuptools.packages.find]
include = ["memorius", "memorius.*"]
exclude = ["hooks"]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"
