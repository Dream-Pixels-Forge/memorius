[project]
name = "memorius"
version = "0.8.0"
description = "Self-contained memory vault for any AI agent — vector search, session diaries, and agent-agnostic hooks."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    {name = "dimonapatrick243", email = "dimona.patrick@gmail.com"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: No Input/Output (Daemon)",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pyyaml>=6.0.1",
    "chromadb>=0.4.22",
    "httpx>=0.25.0",
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.0.0",
    "sse-starlette>=1.0.0",
    "sentence-transformers>=2.6.0",
    "openai>=1.10.0",
    "sqlite-vec>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/Dream-Pixels-Forge/memorius"
Repository = "https://github.com/Dream-Pixels-Forge/memorius"
Issues = "https://github.com/Dream-Pixels-Forge/memorius/issues"

[project.scripts]
memorius = "memorius.cli.main:main"
memorius-hook = "memorius.hooks.cli:main"
memorius-plugin-gen = "memorius.plugin_gen.cli:main"
memorius-normalize = "memorius.normalizers.cli:main"

[tool.setuptools.packages.find]
include = ["memorius", "memorius.*"]

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
memorius = ["data/*"]
